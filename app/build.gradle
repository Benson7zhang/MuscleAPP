plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream ->
        localProperties.load(stream)
    }
}

def escapeBuildConfigString = { value ->
    def safe = (value ?: '')
            .replace('\\', '\\\\')
            .replace('"', '\\"')
    return "\"${safe}\""
}

def longcatApiKey = (System.getenv('LONGCAT_API_KEY') ?: localProperties.getProperty('LONGCAT_API_KEY') ?: '').trim()
def longcatBaseUrl = (System.getenv('LONGCAT_BASE_URL') ?: localProperties.getProperty('LONGCAT_BASE_URL') ?: 'https://api.longcat.chat').trim()
def longcatModel = (System.getenv('LONGCAT_MODEL') ?: localProperties.getProperty('LONGCAT_MODEL') ?: 'LongCat-Flash-Chat').trim()

android {
    namespace = 'com.musclefit.app'
    compileSdk = 35

    defaultConfig {
        applicationId = 'com.musclefit.app'
        minSdk = 29
        targetSdk = 35
        versionCode = 1
        versionName = '1.0'

        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'LONGCAT_API_KEY', escapeBuildConfigString(longcatApiKey)
        buildConfigField 'String', 'LONGCAT_BASE_URL', escapeBuildConfigString(longcatBaseUrl)
        buildConfigField 'String', 'LONGCAT_MODEL', escapeBuildConfigString(longcatModel)
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles = [getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding = true
        compose = true
        buildConfig = true
    }

    lint {
        disable += ['OldTargetApi', 'GradleDependency', 'AndroidGradlePluginVersion']
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.ui:ui:1.7.5'
    implementation 'androidx.compose.foundation:foundation:1.7.5'
    implementation 'androidx.compose.material3:material3:1.3.1'
    implementation 'androidx.compose.runtime:runtime-livedata:1.7.5'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.7.5'
    implementation 'io.coil-kt:coil:2.7.0'
    implementation 'io.coil-kt:coil-compose:2.7.0'

    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    debugImplementation 'androidx.compose.ui:ui-tooling:1.7.5'
}
